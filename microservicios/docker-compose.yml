services:

  # ===================== BASE DE DATOS COMPARTIDA =====================
  mysql:
    image: mysql:8.0
    container_name: ms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - ms-mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - ms-network

  # ===================== EUREKA SERVER =====================
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - ms-network

  # ===================== MICROSERVICIOS =====================
  ms-usuario:
    build:
      context: .
      dockerfile: ms_usuario/Dockerfile
    container_name: ms-usuario
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: "docker"
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    mem_limit: 384m
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - ms-network

  ms-clientes:
