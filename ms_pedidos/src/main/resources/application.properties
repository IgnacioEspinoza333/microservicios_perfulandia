spring.application.name=ms_pedidos

server.port=8090

# Configuración de conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ms_pedidos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Logs propios del microservicio
logging.file.name=logs/ms_pago.log
logging.level.root=INFO
logging.level.com.example.clientes_ms=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Basic Auth
spring.security.user.name=admin
spring.security.user.password=admin123